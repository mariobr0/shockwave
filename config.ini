# =====================================================================
# Shockwave Configuration File (config.ini)
# Все пользовательские настройки интерфейса, распознавания и звука.
# Секретные ключи API хранятся отдельно в файле .env
# =====================================================================

[Sound]
# Воспроизведение фразы Мегатрона ("Мегатрон готов к бою") при запуске программы: true или false
startup_sound = true

# Звуковые сигналы готовности текста при завершении диктовки: true или false
# (Этим параметром также управляет чекбокс 'alert' на виджете)
alert_sound = true


[Interface]
# Глобальная горячая клавиша для запуска записи (например: ctrl+space, alt+space, f8)
hotkey = ctrl+space

# Начальное положение виджета на экране:
# bottom-right (правый нижний угол)
# bottom-left  (левый нижний угол)
# top-center   (вверху по центру)
position = bottom-right

# Прозрачность виджета: от 0.10 (почти невидимый) до 1.00 (полностью непрозрачный)
opacity = 0.85

# Язык консольной панели управления: ru (русский) или en (английский)
language = ru


[Recognition]
# Основной движок распознавания речи: gigaam (очень быстрый) или whisper (для смешанной IT-речи)
engine = gigaam

# Модель Whisper: large-v3-turbo, medium, small, base, tiny
whisper_model = large-v3-turbo

# Язык для Whisper: ru, en, auto
whisper_language = ru

# Модель GigaAM
gigaam_model = gigaam-v3-e2e-rnnt

# Квантование GigaAM: int8 (быстрое, 216 МБ) или пусто для float32 (885 МБ)
gigaam_quantization = int8

# Непрерывное распознавание кодового слова в фоне (без рук): true или false
wake_word_enabled = true

# Кодовое слово для активации и завершения записи (по умолчанию: мега или мегатрон)
wake_word = мега


[Toggles]
# Начальные состояния чекбоксов на плавающем виджете при старте программы (true/false):
# LLM norm - нормализация пунктуации и терминов через LLM
llm_norm = false

# AI task - превращение надиктованной речи в четкий промпт/инструкцию для нейросети
ai_task = false

# to EN - автоматический перевод надиктованного текста на английский язык
to_en = false

# clip+ - добавление надиктованного текста ПЕРЕД ранее скопированным содержимым буфера
clip_prepend = false


[Theme]
# Цветовая палитра плавающего виджета (HEX):
ui_bg_color = #3b274d
ui_grip_color = #2c1c3b

# Цвета консольного терминала:
cli_title_color = #B45FEB
cli_quote_color = #807785

# Отступы текста слева в терминале (число пробелов):
cli_banner_pad = 3
cli_quote_pad = 6
cli_title_pad = 0


[Prompts]
# Пользовательские системные промпты для LLM (оставьте пустыми для использования дефолтных):
# Перевод на английский (to EN):
translate_en = 

# Превращение в директиву/промпт для AI (AI task):
ai_task = 

# Превращение в директиву для AI сразу на английском языке (AI task + to EN):
ai_task_en = 
